# T Poker CI — validates every PR to main and every push to main.
#
# Design notes (2026-07-07):
# - Backend tests are fully self-contained (EF InMemory) — no services, no env, no DB.
# - No global.json / engines anywhere in the repo, so versions are pinned HERE:
#   .NET 8.0.x, Node 20.
# - export-web is the only guard against Metro web-bundling breakage (what Vercel
#   runs at deploy); it is deliberately a separate parallel job so the fast core
#   signal (backend + mobile) is not delayed by it.
# - gitleaks mirrors the manual scan run before every push: current tree + the
#   commit range under review.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · dotnet test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Test (restore + build + run)
        run: dotnet test PokerApp.sln --nologo

  mobile:
    # NAME LISTS EVERY GATE ON PURPOSE. This job runs three: typecheck, lint and unit tests. While
    # it was called "tsc + jest", a lint-budget breach failed it and read as an unrelated tsc/jest
    # failure, costing a full round to diagnose (T0.4, 2026-08-05). A check's name is the first
    # thing anyone sees when it goes red, so it has to say what actually ran.
    #
    # RENAMING THIS CHANGES THE REQUIRED-CHECK CONTEXT. Branch protection on `main` requires checks
    # by exact name, so the required set must be updated to match. Until it is, the old context
    # never reports and PRs stay blocked — recoverable, not a lockout, since enforce_admins is off
    # and the repo admin can still bypass. Swap the whole set in ONE API call (see the PR that
    # introduced this name) rather than hand-typing it in Settings: the name contains U+00B7 MIDDLE
    # DOT, and a typo produces a required context that can never report.
    name: Mobile · tsc + lint + jest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/poker-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/poker-mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        # Fails this JOB on any error, and on the warning count RISING above today's frozen
        # ceiling (--max-warnings) so the pre-existing backlog can only shrink.
        # react-hooks/rules-of-hooks is an ERROR — a violation crashes at runtime and is invisible
        # to tsc, jest and the web export. Severity is pinned by
        # src/config/__tests__/eslintRules.test.ts so it cannot be silently downgraded.
        #
        # This job MUST be listed in main's required-status-check set under its EXACT name. That is
        # owner-side state this file cannot observe, so it is written as a REQUIREMENT with its
        # verification command rather than as a fact:
        #   gh api repos/taysh123/poker-home-games/branches/main/protection \
        #     --jq '.required_status_checks.contexts'
        # If this job's name is absent from that output, this gate is ADVISORY, not blocking.
        # (Two earlier versions of this comment each stated the answer outright and each went stale:
        # one claimed there was no protection at all, the next claimed this job was required while
        # the same commit renamed it out of the required set.)
        #
        # The ceiling is a TOTAL, so this step can fail because of a file the failure never names.
        # Fix the cause; do not raise the number — the backlog is meant to shrink only. Headroom as
        # of 2026-08-05: 119 used of 200.
        run: npm run lint
      - name: Unit tests
        # Positive-offset TZ (matches the user base): jest's local-day/month pins are UTC-blind on
        # a UTC runner — a reverted toISOString() key produces identical output there (Q0 find C1).
        env:
          TZ: Asia/Jerusalem
        run: npx jest --ci

  landing:
    # Same reasoning as the mobile job above: this runs FOUR gates (typecheck, lint, vitest, static
    # build) and was advertising two. Renamed in the same change because the required-check set has
    # to be rewritten once either way — doing it later would mean a second protection edit and a
    # second window with a phantom required context.
    name: Landing · tsc + lint + vitest + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        # next/core-web-vitals already includes react-hooks/rules-of-hooks as an error, and this
        # app is currently clean — gating it costs one line and covers the second React codebase.
        run: npm run lint
      - name: Tests (honesty pins)
        run: npm test
      - name: Static build
        run: npm run build

  export-web:
    name: Mobile · expo export (web)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/poker-mobile
    env:
      # Public production URL (non-secret) — without it the exported bundle would
      # silently point at localhost (src/api/config.ts falls back with a warning).
      EXPO_PUBLIC_API_URL: https://poker-home-games-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/poker-mobile/package-lock.json
      - run: npm ci
      - name: Export web bundle (what Vercel builds)
        run: npx expo export -p web

  gitleaks:
    name: Gitleaks · secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan current tree
        run: gitleaks detect --source . --config .gitleaks.toml --no-git --redact --verbose
      - name: Scan commit range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && [ -n "${{ github.event.before }}" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="-n 25"
          fi
          echo "Scanning: $RANGE"
          gitleaks detect --source . --config .gitleaks.toml --log-opts "$RANGE" --redact --verbose
